};
let lang=new URLSearchParams(location.search).get("lang")||"en";if(!TXT[lang])lang="en";
let db=null,user=null,member=false,flights=[],codes={};let showCodes={};
const id=x=>document.getElementById(x),E=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));const t=TXT[lang];const pairs={back:"back",heading:"title",subheading:"sub",signinTitle:"signin",emailLabel:"email",signinButton:"send",refresh:"refresh",add:"add",logout:"logout",formTitle:"add",travelerLabel:"traveler",airlineLabel:"airline",flightLabel:"flight",legLabel:"leg",legOut:"out",legReturn:"ret",legOther:"other",dateLabel:"date",timeLabel:"time",fromLabel:"from",toLabel:"to",bookingLabel:"booking",notesLabel:"notes",saveLabel:"save",cancel:"cancel",groupTitle:"group",boardTitle:"board",travelersLabel:"travelerCount",outboundLabel:"outCount",returnsLabel:"retCount",privacy:"private",footerNotice:"footer"};for(const [key,val] of Object.entries(pairs))id(key).textContent=t[val];id("back").href="./index.html?lang="+lang;draw()}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;history.replaceState({},"",location.pathname+"?lang="+lang);translate()}));
function ticket(f){const t=TXT[lang],own=f.owner_id===user?.id,code=own?codes[f.id]:null;return `<article class="card"><span class="tag">${f.leg==="return"?t.ret:f.leg==="other"?t.other:t.out}</span><h4>${E(f.airline)} · ${E(f.flight_number)}</h4><div class="muted">${E(f.departure_date)} ${E(f.departure_time||"")} · ${E(f.traveler_name)}</div><div class="route"><b>${E(f.departure_airport)}</b><span>✈</span><b>${E(f.arrival_airport)}</b></div>${f.notes?`<p class="help">${E(f.notes)}</p>`:""}${own&&code?`<div class="confirmation">${t.reference}: <strong>${showCodes[f.id]?E(code):"••••••"}</strong> <button class="btn secondary" data-reveal="${E(f.id)}">${showCodes[f.id]?t.hide:t.show}</button></div>`:""}<div class="actions"><a class="btn secondary" href="https://www.flightaware.com/live/flight/${encodeURIComponent(f.flight_number.replace(/\s+/g,""))}" target="_blank" rel="noopener">${t.track}</a>${own?`<button class="btn danger" data-remove="${E(f.id)}">${t.remove}</button>`:""}</div></article>`}
function draw(){const t=TXT[lang];id("travelers").textContent=new Set(flights.map(x=>x.traveler_name.trim().toLowerCase())).size;id("outbound").textContent=flights.filter(f=>f.leg==="outbound").length;id("returns").textContent=flights.filter(f=>f.leg==="return").length;id("welcome").textContent=t.you+(user?.email||"");const people=[...new Set(flights.map(f=>f.traveler_name))].sort((a,b)=>a.localeCompare(b));id("groups").innerHTML=people.length?people.map(name=>`<section class="group"><h3>👤 ${E(name)}</h3><div class="cardlist">${flights.filter(f=>f.traveler_name===name).map(ticket).join("")}</div></section>`).join(""):`<div class="notice">${t.empty}</div>`;const rows=flights.slice().sort((a,b)=>a.departure_date.localeCompare(b.departure_date)||(a.departure_time||"").localeCompare(b.departure_time||""));id("board").innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>${t.date}</th><th>${t.traveler}</th><th>${t.flight}</th><th>${t.from} → ${t.to}</th><th>${t.leg}</th></tr></thead><tbody>${rows.map(f=>`<tr><td>${E(f.departure_date)} ${E(f.departure_time||"")}</td><td>${E(f.traveler_name)}</td><td>${E(f.airline)} ${E(f.flight_number)}</td><td>${E(f.departure_airport)} → ${E(f.arrival_airport)}</td><td>${f.leg==="return"?t.ret:f.leg==="other"?t.other:t.out}</td></tr>`).join("")}</tbody></table></div>`:"";document.querySelectorAll("[data-reveal]").forEach(b=>b.addEventListener("click",()=>{showCodes[b.dataset.reveal]=!showCodes[b.dataset.reveal];draw()}));document.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",async()=>{if(!confirm(TXT[lang].confirmRemove))return;const {error}=await db.from("trip_flights").delete().eq("id",b.dataset.remove);if(error)id("notice").textContent=error.message;else await load()}))}
async function load(){if(!db||!user)return;const [m,f,c]=await Promise.all([db.from("trip_members").select("user_id,display_name"),db.from("trip_flights").select("*").order("departure_date",{ascending:true}),db.from("trip_flight_confirmations").select("flight_id,confirmation")]);if(m.error||f.error||c.error){id("notice").textContent=m.error?.message||f.error?.message||c.error?.message;return}member=m.data.some(x=>x.user_id===user.id);id("dashboard").classList.toggle("hide",!member);if(!member){id("notice").textContent=TXT[lang].pending+user.id;return}flights=f.data;codes=Object.fromEntries(c.data.map(x=>[x.flight_id,x.confirmation]));id("notice").textContent="✓ "+TXT[lang].members+": "+m.data.length;id("memberCount").textContent=TXT[lang].private;draw()}
async function boot(){translate();if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){id("notice").textContent=TXT[lang].preview;return}try{const m=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm");db=m.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{user:current}}=await db.auth.getUser();user=current;id("signin").classList.toggle("hide",!!user);if(user)await load();else id("notice").textContent=TXT[lang].please;db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"||event==="SIGNED_OUT")if(session?.user?.id!==user?.id)location.reload()})}catch(e){id("notice").textContent="Private login service unavailable; group data was not loaded."}}
id("signinForm").addEventListener("submit",async e=>{e.preventDefault();if(!db)return;const email=new FormData(e.target).get("email");const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});id("authNotice").textContent=error?error.message:TXT[lang].sent});
id("logout").addEventListener("click",async()=>{await db.auth.signOut();location.reload()});
id("refresh").addEventListener("click",load);
id("add").addEventListener("click",()=>id("flightFormBox").classList.remove("hide"));
id("cancel").addEventListener("click",()=>id("flightFormBox").classList.add("hide"));
id("flightForm").addEventListener("submit",async e=>{e.preventDefault();if(!db||!member||!user)return;const form=e.currentTarget,d=new FormData(form),record={owner_id:user.id,traveler_name:String(d.get("traveler_name")||"").trim(),airline:String(d.get("airline")||"").trim(),flight_number:String(d.get("flight_number")||"").trim().toUpperCase(),departure_date:d.get("departure_date"),departure_time:d.get("departure_time")||null,departure_airport:String(d.get("departure_airport")||"").trim().toUpperCase(),arrival_airport:String(d.get("arrival_airport")||"").trim().toUpperCase(),leg:d.get("leg"),notes:String(d.get("notes")||"").trim()};const btn=id("saveLabel");btn.disabled=true;btn.textContent=TXT[lang].saving;try{const {data:inserted,error}=await db.from("trip_flights").insert(record).select("id").single();if(error)throw error;const code=String(d.get("confirmation")||"").trim().toUpperCase();if(code){const {error:ce}=await db.from("trip_flight_confirmations").insert({flight_id:inserted.id,owner_id:user.id,confirmation:code});if(ce){id("formNotice").textContent="Flight saved but private booking reference was not saved: "+ce.message;await load();return}}form.reset();id("flightFormBox").classList.add("hide");id("formNotice").textContent="";await load();id("notice").textContent=TXT[lang].saved}catch(err){id("formNotice").textContent=TXT[lang].error+" "+err.message}finally{btn.disabled=false;btn.textContent=TXT[lang].save}});
boot();
