<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123839"><title>Group Flights Demo | ROAD TRIP 2027</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#193e37;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#102b2c;color:#fff;padding:14px 20px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-family:Georgia,serif;letter-spacing:.05em;font-weight:700;font-size:20px}header a{color:#f1e0ae;text-decoration:none;font-size:13px;font-weight:700}.langbuttons{display:flex;gap:5px}.langbuttons button{padding:8px 11px;border:1px solid #a9c3b9;border-radius:16px;background:transparent;color:white;cursor:pointer}.langbuttons button.active{background:#d0ad72;color:#14332d}.container{max-width:1100px;margin:auto;padding:18px}.smallgold{color:#c6ac76;font-size:11px;letter-spacing:.12em;font-weight:800}.flight-demo{max-width:1000px;margin:15px auto 40px}.flight-nav{margin:10px 0 0}.flight-nav a{display:inline-block;border-radius:16px;padding:10px 15px;background:#e6eee6;color:#19473f;font-weight:800;text-decoration:none;font-size:13px}
.flight-nav{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.flight-nav button{background:white;border:1px solid #b8d0c4;padding:11px 16px;border-radius:22px;color:#17544a;font-weight:800;cursor:pointer}.flight-nav button.active{background:#195c54;color:#fff}
.flight-demo{border:1px solid #cdded4;border-radius:20px;overflow:hidden;margin:14px 0 40px;background:#f3f8f3}
.flight-demo-head{padding:26px;background:#123839;color:white}.flight-demo-head h2{font:600 34px 'Playfair Display','Heebo',serif;margin:7px 0}.flight-demo-head p{font-size:13px;color:#d1e5de}
.flight-demo-body{padding:19px}.flight-subnav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.flight-subnav button{background:white;border:1px solid #b8d0c4;border-radius:12px;padding:9px 13px;cursor:pointer}.flight-subnav button.active{background:#1a635a;color:white}
.flight-form{background:white;border:1px solid #d2e1d7;border-radius:14px;padding:16px;margin:14px 0}
.flight-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flight-fields label{font-size:12px;font-weight:700;color:#587065;display:flex;flex-direction:column;gap:5px}
.flight-fields input,.flight-fields select{font:inherit;font-size:13px;width:100%;border:1px solid #c9dad0;border-radius:10px;padding:10px;background:#fbfdfb;color:#163d36}
.flight-btn{background:#1c645b;color:white;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-size:12px;font-weight:800}
.flight-btn.alt{background:#e4efe8;color:#21584f;border:1px solid #bad1c4}
.flight-ticket{background:white;border:1px solid #d6e3d9;border-radius:15px;padding:18px;margin:12px 0}
.flight-ticket-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.flight-route{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}
.flight-route strong{font-size:29px}.flight-route span{color:#6f8f82}
.flight-ticket-footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flight-ticket small{color:#647a6e;font-size:11px}
.flight-note{font-size:12px;color:#4b6b5b;background:#e6f0e8;border-radius:11px;padding:12px;margin-bottom:14px}
@media(max-width:700px){.flight-fields{grid-template-columns:1fr 1fr}}
@media(max-width:440px){.flight-fields{grid-template-columns:1fr}.flight-demo-body{padding:12px}}

</style><style>
.group-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.group-summary>div{background:white;padding:16px;border-radius:13px;border:1px solid #d5e4da;text-align:center}.group-summary strong{display:block;font-size:23px;color:#13574b}.group-summary small{color:#718579;font-size:11px}
.traveler-block{background:#fff;padding:15px;border-radius:16px;border:1px solid #d4e5d8;margin:14px 0}.traveler-block>h4{margin:0 0 8px;font-size:17px}.traveler-block>.flight-ticket{box-shadow:none;background:#fbfdfb}.traveler-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.traveler-count{font-size:11px;color:#668075}
.flight-board-filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.flight-board-filters button{background:#eff5ef;border:1px solid #c5d9c9;border-radius:20px;padding:8px 12px;color:#22594e;cursor:pointer;font-size:12px}.flight-board-filters button.active{background:#175e56;color:white}
.flight-board-schedule{width:100%;border-collapse:collapse;font-size:12px;background:white;border-radius:12px;overflow:hidden}.flight-board-schedule th,.flight-board-schedule td{text-align:start;padding:10px;border-bottom:1px solid #deebe0}.flight-board-schedule th{background:#e9f3ec}.flight-board-wrap{overflow-x:auto}
@media(max-width:520px){.group-summary{grid-template-columns:repeat(3,1fr)}.group-summary>div{padding:10px}.group-summary strong{font-size:19px}}
.booking-reference{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#f3f7f2;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:12px}.booking-reference strong{letter-spacing:.11em}.booking-reference button{border:1px solid #bdd2c3;background:white;color:#1b5e52;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}.booking-disclaimer{grid-column:1/-1;font-size:11px;color:#8b5c3b;background:#fff4e5;padding:10px 12px;border-radius:10px;line-height:1.5}</style></head><body><header><div class="brand">ROAD TRIP <span style="color:#d4b77c">•</span> 2027</div><nav><a href="./index.html" id="back-guide">← Rome Travel Guide</a></nav><div class="langbuttons"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="he">עברית</button></div></header><main class="container"><nav class="flight-nav"><a href="./index.html" id="back-2">← Rome guide</a></nav><div id="app"></div></main><script>
let lang=new URLSearchParams(location.search).get("lang")||"en";if(!["en","es","he"].includes(lang))lang="en";
const E=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FLIGHT_TX={
en:{booking:"Booking confirmation (optional)",showBooking:"Show",hideBooking:"Hide",refPrivacy:"Booking references are private. In this demo they are stored only for this browser tab, not in the public repository or the group board. Avoid entering real sensitive codes until secure sign-in is available.",guide:"Explore Rome",flights:"✈ Group Flights Demo",title:"Group Flights · Live Tracking",subtitle:"Test your actual flight number in a private-on-this-device demo. Live status opens through FlightAware; it is not streamed into this site yet.",mine:"My Flights",group:"Everyone’s Itineraries",add:"Add your flight",name:"Traveler / couple label",number:"Flight number (e.g. DL123)",airline:"Airline",date:"Departure date",from:"From (airport code)",to:"To (airport code)",direction:"Leg",out:"Outbound",back:"Return",save:"Save flight",remove:"Remove",track:"Live flight updates ↗",empty:"No flights added yet. Enter your flight below.",privacy:"Demo only: no login, no airline connection, no public booking records. Do not enter confirmation numbers. Entries stay in this browser.",status:"Status: not connected",notice:"FlightAware opens separately and may not show a flight until closer to departure. Confirm changes directly with your airline.",who:"Traveler",board:"Everyone’s Flight Itinerary",bad:"Please enter a flight number and a valid date.",cancel:"Cancel"},
es:{booking:"Código de reserva (opcional)",showBooking:"Mostrar",hideBooking:"Ocultar",refPrivacy:"Las referencias de reserva son privadas. En esta demostración solo se conservan en esta pestaña; no aparecen en el tablero del grupo ni en GitHub. No introduzcas datos sensibles reales hasta contar con acceso seguro.",guide:"Explorar Roma",flights:"✈ Vuelos del grupo · Demo",title:"Vuelos del grupo · Seguimiento",subtitle:"Prueba tu número de vuelo real. El seguimiento se abre en FlightAware; aún no se integra en esta página.",mine:"Mis vuelos",group:"Itinerarios de todos",add:"Añadir vuelo",name:"Viajero / pareja",number:"Número de vuelo (p. ej. DL123)",airline:"Aerolínea",date:"Fecha de salida",from:"Origen (aeropuerto)",to:"Destino (aeropuerto)",direction:"Trayecto",out:"Ida",back:"Regreso",save:"Guardar vuelo",remove:"Eliminar",track:"Seguimiento en vivo ↗",empty:"Aún no hay vuelos. Añade el primero.",privacy:"Solo demo: sin cuentas ni reservas públicas. No introduzcas códigos de reserva. Los datos quedan en este navegador.",status:"Estado: no conectado",notice:"FlightAware se abre aparte y puede no mostrar tu vuelo hasta fechas próximas. Confirma con la aerolínea.",who:"Viajero",board:"Itinerarios de todo el grupo",bad:"Introduce un vuelo y fecha válidos.",cancel:"Cancelar"},
he:{booking:"מספר אישור הזמנה (לא חובה)",showBooking:"הצגה",hideBooking:"הסתרה",refPrivacy:"קוד ההזמנה פרטי. בהדגמה הוא נשמר רק בכרטיסיית הדפדפן הזו, אינו מפורסם באתר או בלוח הקבוצה. מומלץ לא להזין קודים אמיתיים עד שיופעל חיבור מאובטח.",guide:"מדריך רומא",flights:"✈ טיסות הקבוצה · הדגמה",title:"טיסות הקבוצה · מעקב טיסות",subtitle:"הזינו מספר טיסה אמיתי לבדיקת ההדגמה. מעקב חי נפתח ב-FlightAware ולא מוזרם עדיין לאתר.",mine:"הטיסות שלי",group:"המסלולים של כולם",add:"הוספת טיסה",name:"שם נוסע / זוג",number:"מספר טיסה (למשל DL123)",airline:"חברת תעופה",date:"תאריך המראה",from:"מוצא (קוד שדה)",to:"יעד (קוד שדה)",direction:"כיוון",out:"הלוך",back:"חזור",save:"שמירת טיסה",remove:"הסרה",track:"עדכוני טיסה חיים ↗",empty:"טרם נוספו טיסות. הוסיפו טיסה.",privacy:"הדגמה בלבד: אין כניסה לחשבון או סנכרון. אין להזין מספרי אישור הזמנה. הנתונים נשמרים בדפדפן זה.",status:"סטטוס: לא מחובר",notice:"FlightAware נפתח בחלון נפרד ועשוי להציג טיסה רק סמוך להמראה. יש לאמת שינויים מול חברת התעופה.",who:"נוסע",board:"מסלולי הטיסה של כולם",bad:"יש להזין מספר טיסה ותאריך תקינים.",cancel:"ביטול"}
};
let viewTab=location.hash==="#group-flights"?"flights":"guide",flightSub="mine",flightFormVisible=false;
let demoFlights=[];try{const list=JSON.parse(localStorage.getItem("roadtrip2027-demo-flights")||"[]");if(Array.isArray(list))demoFlights=list.filter(x=>x&&typeof x.number==="string").slice(0,30)}catch(e){}
const saveDemoFlights=()=>{try{localStorage.setItem("roadtrip2027-demo-flights",JSON.stringify(demoFlights))}catch(e){}};
let bookingShown={};const confirmationKey=id=>"roadtrip2027-booking-"+id;
const getBooking=id=>{try{return sessionStorage.getItem(confirmationKey(id))||""}catch(e){return ""}};
const setBooking=(id,code)=>{try{if(code)sessionStorage.setItem(confirmationKey(id),code);else sessionStorage.removeItem(confirmationKey(id))}catch(e){}};
function flightCard(f,index){const t=FLIGHT_TX[lang];return `<article class="flight-ticket"><div class="flight-ticket-top"><strong>${E(f.airline)} · ${E(f.number.toUpperCase())}</strong><small>${E(f.date)} · ${E(f.direction==="back"?t.back:t.out)}</small></div><div class="flight-route"><div><strong>${E(f.from.toUpperCase())}</strong></div><span>✈ ──────</span><div><strong>${E(f.to.toUpperCase())}</strong></div></div><p style="font-size:12px">👤 ${E(f.name)} · <b>${t.status}</b></p>${flightSub==="mine"&&getBooking(f.id||"legacy-"+index)?`<div class="booking-reference"><span>${t.booking}:</span><strong>${bookingShown[f.id||"legacy-"+index]?E(getBooking(f.id||"legacy-"+index)):"••••••"}</strong><button type="button" data-booking-toggle="${E(f.id||"legacy-"+index)}">${bookingShown[f.id||"legacy-"+index]?t.hideBooking:t.showBooking}</button></div>`:""}<div class="flight-ticket-footer"><a class="flight-btn" href="https://www.flightaware.com/live/flight/${encodeURIComponent(f.number.toUpperCase())}" target="_blank" rel="noopener">${t.track}</a><button class="flight-btn alt" data-flight-remove="${index}">${t.remove} ×</button></div></article>`}

const groupWords={
en:{people:"Travelers / couples",flights:"Flights",out:"Outbound flights",returns:"Return flights",all:"All flights",board:"All arrivals & departures",name:"Traveler / couple",flight:"Flight",date:"Travel date",route:"Route",direction:"Leg",disclaimer:"Group view shows only flights entered in this browser. Other travelers' phones will not automatically sync until private group accounts are connected.",same:"Use the same traveler/couple label for both outbound and return flights.",none:"No group flight itineraries have been entered yet."},
es:{people:"Viajeros / parejas",flights:"Vuelos",out:"Vuelos de ida",returns:"Vuelos de vuelta",all:"Todos los vuelos",board:"Todas las llegadas y salidas",name:"Viajero / pareja",flight:"Vuelo",date:"Fecha",route:"Ruta",direction:"Tramo",disclaimer:"Solo muestra los vuelos añadidos en este navegador. Los móviles de otros viajeros no se sincronizan sin cuentas privadas.",same:"Usa el mismo nombre de viajero o pareja para ida y vuelta.",none:"No hay itinerarios añadidos."},
he:{people:"נוסעים / זוגות",flights:"טיסות",out:"טיסות הלוך",returns:"טיסות חזור",all:"כל הטיסות",board:"כל ההגעות וההמראות",name:"נוסע / זוג",flight:"טיסה",date:"תאריך",route:"מסלול",direction:"כיוון",disclaimer:"מוצגות רק טיסות שנוספו בדפדפן הזה. אין סנכרון אוטומטי ממכשירים של נוסעים אחרים ללא חשבונות פרטיים.",same:"יש להשתמש באותו שם נוסע / זוג בטיסת ההלוך והחזור.",none:"עדיין לא נוספו טיסות."}
};
let groupFilter="all";
function groupFlightView(){
const t=groupWords[lang],ft=FLIGHT_TX[lang];
const names=[...new Set(demoFlights.map(x=>x.name.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const visible=demoFlights.map((f,index)=>({...f,index})).filter(f=>groupFilter==="all"||f.name===groupFilter);
const summary=`<div class="group-summary"><div><strong>${names.length}</strong><small>${t.people}</small></div><div><strong>${demoFlights.filter(f=>f.direction!=="back").length}</strong><small>${t.out}</small></div><div><strong>${demoFlights.filter(f=>f.direction==="back").length}</strong><small>${t.returns}</small></div></div>`;
const filters=`<div class="flight-board-filters"><button data-group-filter="all" class="${groupFilter==="all"?"active":""}">${t.all}</button>${names.map(n=>`<button data-group-filter="${E(n)}" class="${groupFilter===n?"active":""}">${E(n)}</button>`).join("")}</div>`;
const blocks=names.filter(n=>groupFilter==="all"||groupFilter===n).map(n=>{const flights=visible.filter(f=>f.name===n).sort((a,b)=>a.date.localeCompare(b.date)||(a.direction==="back"?1:-1));return `<section class="traveler-block"><div class="traveler-head"><h4>👤 ${E(n)}</h4><span class="traveler-count">${flights.length} ${t.flights}</span></div>${flights.map(f=>flightCard(f,f.index)).join("")}</section>`}).join("");
const sorted=visible.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
const table=sorted.length?`<div class="flight-board-wrap"><table class="flight-board-schedule"><thead><tr><th>${t.date}</th><th>${t.name}</th><th>${t.flight}</th><th>${t.route}</th><th>${t.direction}</th></tr></thead><tbody>${sorted.map(f=>`<tr><td>${E(f.date)}</td><td>${E(f.name)}</td><td>${E(f.number)}</td><td>${E(f.from)} → ${E(f.to)}</td><td>${f.direction==="back"?ft.back:ft.out}</td></tr>`).join("")}</tbody></table></div>`:"";
return `<div class="flight-note">ℹ ${t.disclaimer}</div>${summary}${filters}${blocks||`<div class="flight-note">${t.none}</div>`}<h3>${t.board}</h3>${table}`;
}
function renderFlightApp(){const t=FLIGHT_TX[lang];return `<section class="flight-demo" id="flight-demo"><div class="flight-demo-head"><div class="smallgold">ROAD TRIP 2027 · ROME</div><h2>${t.title}</h2><p>${t.subtitle}</p></div><div class="flight-demo-body"><div class="flight-note">🔒 ${t.privacy}</div><div class="flight-subnav"><button class="${flightSub==="mine"?"active":""}" data-flight-sub="mine">${t.mine}</button><button class="${flightSub==="group"?"active":""}" data-flight-sub="group">${t.group}</button></div><h3>${flightSub==="mine"?t.mine:t.board}</h3>${flightSub==="group"?groupFlightView():(demoFlights.length?demoFlights.map((f,n)=>flightCard(f,n)).join(""):`<div class="flight-note">${t.empty}</div>`)}<p class="flight-note">${t.notice}</p><button class="flight-btn" id="flight-add-toggle">+ ${t.add}</button>${flightFormVisible?`<form id="flight-form" class="flight-form"><div class="flight-fields"><label>${t.name}<input name="name" required maxlength="60" placeholder="Couple 1"></label><label>${t.number}<input name="number" required maxlength="10" placeholder="DL123" pattern="[A-Za-z0-9]{2,10}" autocomplete="off"></label><label>${t.airline}<input name="airline" required placeholder="Delta"></label><label>${t.date}<input type="date" name="date" required value="2026-12-31"></label><label>${t.booking}<input name="booking" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="••••••"></label><p class="booking-disclaimer">🔒 ${t.refPrivacy}</p><label>${t.from}<input name="from" required maxlength="4" pattern="[A-Za-z]{3,4}" placeholder="MIA"></label><label>${t.to}<input name="to" required maxlength="4" pattern="[A-Za-z]{3,4}" placeholder="FCO"></label><label>${t.direction}<select name="direction"><option value="out">${t.out}</option><option value="back">${t.back}</option></select></label></div><div style="display:flex;gap:8px;margin-top:14px"><button type="submit" class="flight-btn">${t.save}</button><button type="button" id="flight-cancel" class="flight-btn alt">${t.cancel}</button></div></form>`:""}</div></section>`}
function bindFlights(){
document.querySelectorAll("[data-view-tab]").forEach(b=>b.addEventListener("click",()=>{viewTab=b.dataset.viewTab;location.hash=viewTab==="flights"?"group-flights":"explore";render()}));
document.querySelectorAll("[data-flight-sub]").forEach(b=>b.addEventListener("click",()=>{flightSub=b.dataset.flightSub;render()}));
document.querySelectorAll("[data-group-filter]").forEach(b=>b.addEventListener("click",()=>{groupFilter=b.dataset.groupFilter;render()}));
document.getElementById("flight-add-toggle")?.addEventListener("click",()=>{flightFormVisible=!flightFormVisible;render();document.getElementById("flight-form")?.scrollIntoView({block:"nearest"})});
document.getElementById("flight-cancel")?.addEventListener("click",()=>{flightFormVisible=false;render()});
document.getElementById("flight-form")?.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(e.currentTarget);const f={name:String(d.get("name")).trim(),number:String(d.get("number")).trim().toUpperCase(),airline:String(d.get("airline")).trim(),date:String(d.get("date")),from:String(d.get("from")).trim().toUpperCase(),to:String(d.get("to")).trim().toUpperCase(),direction:String(d.get("direction")),id:"flt-"+Date.now()+"-"+Math.random().toString(36).slice(2,9)};if(!/^[A-Z0-9]{2,10}$/.test(f.number)||!f.date){alert(FLIGHT_TX[lang].bad);return}setBooking(f.id,String(d.get("booking")||"").trim().toUpperCase());demoFlights.push(f);saveDemoFlights();flightFormVisible=false;render()});
document.querySelectorAll("[data-booking-toggle]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.bookingToggle;bookingShown[id]=!bookingShown[id];render()}));
document.querySelectorAll("[data-flight-remove]").forEach(b=>b.addEventListener("click",()=>{const index=Number(b.dataset.flightRemove),f=demoFlights[index];if(f){setBooking(f.id||"legacy-"+index,"");delete bookingShown[f.id||"legacy-"+index]}demoFlights.splice(index,1);saveDemoFlights();render()}));
}

function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.querySelectorAll(".langbuttons button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));const back=lang==="es"?"← Guía de Roma":lang==="he"?"← מדריך רומא":"← Rome guide";document.getElementById("back-guide").textContent=back;document.getElementById("back-2").textContent=back;document.getElementById("back-guide").href="./index.html?lang="+lang;document.getElementById("back-2").href="./index.html?lang="+lang;document.getElementById("app").innerHTML=renderFlightApp();bindFlights()}
document.querySelectorAll(".langbuttons button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;history.replaceState({}, "",location.pathname+"?lang="+lang);render()}));
render();
</script></body></html>
