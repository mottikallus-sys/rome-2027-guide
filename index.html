const EVENT_URL='https://www.turismoroma.it/en/events';
let EVENTS=[];let eventUpdated='';let feedConnected=false;
const GROUPS=[['kosher','cafe.jpg'],['landmarks','colosseum.jpg'],['museums','pantheon.jpg'],['spa','thermal.jpg'],['seasonal','christmas.jpg'],['nightlife','cocktails.jpg'],['clubs','dance.jpg'],['atv','quad.jpg'],['events','navona.jpg']];
let lang=new URLSearchParams(location.search).get('lang')||'en';if(!UI[lang])lang='en';let openCategory=null;
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function duration(d){if(!d||/not practical/i.test(d))return '—';return E(d)+' min'}
function mapUrl(i){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent('Viale Angelico 38, Roma, Italy')+'&destination='+encodeURIComponent(i.destination+', Italy')+'&travelmode=driving'}
function statusName(s,t){return t[s]||t.candidate}
function makeCard(i,t){return `<article class="item"><div class="item-photo"><img loading="lazy" alt="${E(i.names[lang])} — ${E(i.photo_note)}" src="${i.photo}"><span class="photocap">${E(i.photo_note)}</span></div><div class="itembody"><h3>${E(i.names[lang])}</h3><span class="badge ${i.status}">${E(statusName(i.status,t))}</span><p class="desc">${E(i.descs[lang])}</p><div class="transport"><div><small>🚶 ${t.walk}</small><b>${duration(i.walk)}</b></div><div><small>🚕 ${t.car}</small><b>${duration(i.car)}</b></div><div><small>🚇 ${t.transit}</small><b>${duration(i.transit)}</b></div></div><a class="mapbtn" href="${mapUrl(i)}" target="_blank" rel="noopener">${t.maps} ↗</a></div></article>`}
function renderEvents(t){const rows=EVENTS.filter(e=>e.date>='2026-12-31'&&e.date<='2027-01-06').sort((a,b)=>a.date.localeCompare(b.date));const cards=rows.map(e=>`<article class="event-card"><time>${E(e.date)}</time><h3>${E(e.title)}</h3><p>${E(e.venue||'Rome')} · ${E(e.description||'')}</p><a href="${E(e.url)}" target="_blank" rel="noopener">${E(t.event_source||'Details')} ↗</a></article>`).join('');return `<div class="event-intro"><h3>${E(t.event_title||'Events during our stay')}</h3><p>${E(t.event_hint||'Check official dates before visiting.')}</p>${feedConnected?`<small>↻ ${E(t.event_fresh||'Updated')}: ${E(eventUpdated)}</small>`:''}</div><div class="event-grid">${cards||`<p>${E(t.event_none||'No dated events published yet')}</p>`}</div><div class="official-cal"><a target="_blank" rel="noopener" href="${EVENT_URL}">${E(t.event_calendar||'Official Rome events calendar')} ↗</a><a target="_blank" rel="noopener" href="https://www.romatoday.it/eventi/">RomaToday · Events ↗</a><a target="_blank" rel="noopener" href="https://www.ticketone.it/city/roma-216/">TicketOne · Roma ↗</a></div>`;}
function render(){const t=UI[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.querySelectorAll('.langbuttons button').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));document.getElementById('lab-home').textContent=t.home;document.getElementById('lab-weather').textContent=t.weather;let cards=GROUPS.map(([cat,img],n)=>`<button type="button" class="category-tile ${openCategory===cat?'active':''}" data-cat="${cat}" aria-expanded="${openCategory===cat}"><img alt="" src="assets/${img}"><span class="tile-copy"><span class="number">0${n+1} / ${cat==='events'?EVENTS.length:ITEMS.filter(x=>x.category===cat).length} ${cat==='events'?'EVENTS':'PLACES'}</span><h3>${t[cat]}</h3><span class="plus">${openCategory===cat?'−':'+'} ${openCategory===cat?t.close:t.open}</span></span></button>`).join('');
let panels=GROUPS.map(([cat,img])=>`<section class="panel ${openCategory===cat?'open':''}" id="panel-${cat}" aria-label="${E(t[cat])}"><div class="panelhead"><div><span class="smallgold">THE CITY EDIT</span><h2>${t[cat]}</h2><span>${cat==='events'?EVENTS.length:ITEMS.filter(x=>x.category===cat).length} ${lang==='he'?'מקומות':lang==='es'?'lugares':'places'}</span></div><button class="close-btn" data-close="${cat}">✕ ${t.close}</button></div>${cat==='events'?renderEvents(t):`<div class="cards">${ITEMS.filter(x=>x.category===cat).map(i=>makeCard(i,t)).join('')}</div>`}</section>`).join('');
const dayData=DAYS[lang];let calendar=`<section class="calendar"><div class="smallgold">31 DEC — 06 JAN</div><h2>${t.plan}</h2><div class="days">${dayData.map(d=>`<div class="day"><strong>${E(d[0])}</strong>${E(d[1])}</div>`).join('')}</div></section>`;
document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-inner"><div class="eyebrow">ROME · ITALY · WINTER EDITION</div><h1>${t.headline}</h1><p>${t.subtitle}</p><a href="#explore">${t.open} ↓</a></div></section><main class="container"><div class="intro" id="explore"><div class="smallgold">CURATED FOR THE GROUP</div><h2>${lang==='he'?'כל רומא, לפי קטגוריות':lang==='es'?'Todo Roma, por categorías':'Everything, beautifully organized'}</h2><p>${t.tip}</p></div><div class="category-grid">${cards}</div>${panels}${calendar}<p class="footnote">${t.note} ${t.status} ${t.photo_notice}</p></main><footer>${t.footer}</footer>`;
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{let c=b.dataset.cat;openCategory=openCategory===c?null:c;render();if(openCategory)requestAnimationFrame(()=>document.getElementById('panel-'+c).scrollIntoView({block:'start',behavior:'smooth'}));}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{openCategory=null;render();document.getElementById('explore').scrollIntoView({block:'start',behavior:'smooth'})}));}
document.querySelectorAll('.langbuttons button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;history.replaceState({},'',location.pathname+'?lang='+lang);render()}));
const weatherNames={en:{0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm'},es:{0:'Despejado',1:'Casi despejado',2:'Algo nublado',3:'Nublado',45:'Niebla',61:'Lluvia',63:'Lluvia',80:'Chubascos',95:'Tormenta'},he:{0:'בהיר',1:'בהיר ברובו',2:'מעונן חלקית',3:'מעונן',45:'ערפל',61:'גשום',63:'גשום',80:'ממטרים',95:'סופת רעמים'}};
async function live(){const t=UI[lang];let abort=new AbortController();let timeout=setTimeout(()=>abort.abort(),10000);
let jobs=[fetch('https://api.frankfurter.dev/v2/rate/usd/eur',{signal:abort.signal}).then(r=>{if(!r.ok)throw Error('FX');return r.json()}).then(d=>{document.getElementById('usd').textContent=`$1 = €${Number(d.rate).toFixed(3)}`;document.getElementById('usd-date').textContent=`${t.currency_asof} · ${d.date}`}).catch(()=>{document.getElementById('usd').textContent=t.unavailable}),fetch('https://api.frankfurter.dev/v2/rate/ils/eur',{signal:abort.signal}).then(r=>{if(!r.ok)throw Error('FX');return r.json()}).then(d=>{document.getElementById('ils').textContent=`₪1 = €${Number(d.rate).toFixed(3)}`;document.getElementById('ils-date').textContent=`${t.currency_asof} · ${d.date}`}).catch(()=>{document.getElementById('ils').textContent=t.unavailable}),fetch('https://api.open-meteo.com/v1/forecast?latitude=41.9028&longitude=12.4964&current=temperature_2m,weather_code&timezone=Europe%2FRome',{signal:abort.signal}).then(r=>{if(!r.ok)throw Error('WEATHER');return r.json()}).then(d=>{let v=d.current;document.getElementById('weather').textContent=`${Math.round(v.temperature_2m)}°C · ${weatherNames[lang][v.weather_code]||weatherNames.en[v.weather_code]||'Rome'}`;document.getElementById('weather-date').textContent=`${t.weather_asof} · ${v.time.replace('T',' ')}`}).catch(()=>{document.getElementById('weather').textContent=t.unavailable})];await Promise.allSettled(jobs);clearTimeout(timeout)}
render();live();(async()=>{try{let r=await fetch('./events.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('feed');let data=await r.json();EVENTS=Array.isArray(data.events)?data.events:[];eventUpdated=data.updated||'';feedConnected=!!data.automatic;render()}catch(e){EVENTS=[];render()}})();document.getElementById('refresh').addEventListener('click',live);
</script></body></html>
