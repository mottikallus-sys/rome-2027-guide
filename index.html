function suggestedItinerary(){const t=NEARBY_TEXT[lang];return `<section class="nearby-section" id="suggested-nearby"><div class="smallgold">31 DEC — 06 JAN · SMART ROUTES</div><h2>${t.title}</h2><p>${t.hint}</p><div class="nearby-days">${NEARBY_DAYS.map(day=>{const opts=(day.alternatives||[]).map(id=>ITEMS.find(x=>x.id===id)).filter(Boolean),stops=day.ids.map(id=>ITEMS.find(x=>x.id===id)).filter(Boolean);const all=stops.length?stops:opts;return `<article class="nearby-day"><div class="nearby-day-header"><span class="nearby-date">${E(dateName(day.date))}</span><strong>${E(day.area[lang])}</strong></div><p class="nearby-hint">${E(nearbyNote(day))}</p>${all.length?`<div class="nearby-stops">${all.map((i,n)=>`<label class="nearby-stop"><input type="checkbox" data-nearby-pick="${day.date}" value="${i.id}" ${!day.alternatives?"checked":""}/><span><b>${E(i.names[lang])}</b><small>${E(areaTitle(i.area))} · ${E(i.status)}</small></span></label>`).join("")}</div>`:`<p class="nearby-empty">${t.caution}</p>`}<div class="nearby-actions">${all.length?`<button type="button" data-nearby-add="${day.date}">${t.add}</button>`:""}${nearbyRoute(day)?`<a target="_blank" rel="noopener" href="${E(nearbyRoute(day))}">⌖ ${t.route} ↗</a>`:""}<a href="#daily-planner" data-nearby-edit="${day.date}">${t.review} ↗</a></div></article>`}).join("")}</div><small>${t.distance} · ${t.holiday}</small></section>`;}
function bindSuggested(){
document.querySelectorAll("[data-nearby-add]").forEach(b=>b.addEventListener("click",()=>{
 const date=b.dataset.nearbyAdd;
 const choices=[...document.querySelectorAll('[data-nearby-pick="'+date+'"]:checked')].map(x=>x.value);
 if(!choices.length)return;
 choices.forEach(id=>{const prev=savedPlan.dates[id];if(prev&&prev!==date){savedPlan.order[prev]=dayIds(prev).filter(x=>x!==id)}savedPlan.dates[id]=date;if(!savedPlan.favorites.includes(id))savedPlan.favorites.push(id)});
 savedPlan.order[date]=[...dayIds(date)];
 builderDate=date;persist();render();document.getElementById("daily-planner")?.scrollIntoView({block:"start",behavior:"smooth"});
}));
document.querySelectorAll("[data-nearby-edit]").forEach(b=>b.addEventListener("click",()=>{builderDate=b.dataset.nearbyEdit;render();requestAnimationFrame(()=>document.getElementById("daily-planner")?.scrollIntoView({block:"start",behavior:"smooth"}))}));
}

function planBox(){const t=V4[lang];return `<section class="planning-box" id="my-plan"><h2>♥ ${t.favorites}</h2><p>${savedPlan.favorites.length?savedPlan.favorites.map(id=>ITEMS.find(i=>i.id===id)?.names[lang]).filter(Boolean).map(E).join(" · "):t.empty}</p><h2 style="margin-top:20px">${t.dayplan}</h2><p>${t.unassigned}</p><div class="plan-lists">${dayOptions.map((date,n)=>`<div class="plan-list"><h3>${E(DAYS[lang][n][0])}</h3>${Object.entries(savedPlan.dates).filter(([id,d])=>d===date).map(([id])=>{const i=ITEMS.find(x=>x.id===id);return i?`<div class="plan-item"><span>${E(i.names[lang])}</span><button data-unassign="${id}" aria-label="Remove">✕</button></div>`:""}).join("")||`<small>${t.choose}</small>`}</div>`).join("")}</div></section>`}
function bindV4(){
bindBuilder();
bindSuggested();
const search=document.getElementById("place-search");if(search)search.addEventListener("input",e=>{query=e.target.value;if(query && !openCategory){const match=ITEMS.find(i=>(i.names.en+" "+i.names.es+" "+i.names.he+" "+i.descs[lang]+" "+i.destination).toLowerCase().includes(query.toLowerCase()));if(match)openCategory=match.category}render();const n=document.getElementById("place-search");n.focus();n.setSelectionRange(query.length,query.length)});
document.getElementById("area-filter")?.addEventListener("change",e=>{areaFilter=e.target.value;render()});
document.getElementById("status-filter")?.addEventListener("change",e=>{statusFilter=e.target.value;render()});
document.getElementById("saved-toggle")?.addEventListener("click",()=>{savedOnly=!savedOnly;render()});
document.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.save;const k=savedPlan.favorites.indexOf(id);if(k>=0)savedPlan.favorites.splice(k,1);else savedPlan.favorites.push(id);persist();render()}));
document.querySelectorAll("[data-day]").forEach(x=>x.addEventListener("change",()=>{if(x.value)savedPlan.dates[x.dataset.day]=x.value;else delete savedPlan.dates[x.dataset.day];persist();render()}));
document.querySelectorAll("[data-unassign]").forEach(x=>x.addEventListener("click",()=>{delete savedPlan.dates[x.dataset.unassign];persist();render()}));
document.querySelectorAll("[data-map-area]").forEach(b=>b.addEventListener("click",()=>{mapArea=b.dataset.mapArea;render();document.querySelector(".map-areas")?.scrollIntoView({block:"center",behavior:"smooth"})}));
}
function makeCard(i,t){const l=V4[lang];const fav=savedPlan.favorites.includes(i.id);const selected=savedPlan.dates[i.id]||"";return `<article class="item"><div class="item-photo"><img loading="lazy" alt="${E(i.names[lang])}" src="${i.photo}" onerror="this.onerror=null;this.src='${E(i.image)}'"><span class="photocap">${E(i.photo_note)}</span></div><div class="itembody"><h3>${E(i.names[lang])}</h3><span class="badge ${i.status}">${E(statusName(i.status,t))}</span><p class="desc">${E(i.descs[lang])}</p><small>⌖ ${E(areaTitle(i.area))}</small><div class="transport"><div><small>🚶 ${t.walk}</small><b>${duration(i.walk)}</b></div><div><small>🚕 ${t.car}</small><b>${duration(i.car)}</b></div><div><small>🚇 ${t.transit}</small><b>${duration(i.transit)}</b></div></div><a class="mapbtn" href="${mapUrl(i)}" target="_blank" rel="noopener">${t.maps} ↗</a><button type="button" class="favorite ${fav?'active':''}" data-save="${i.id}">${fav?l.remove:l.save}</button><div class="day-action"><select class="day-select" data-day="${i.id}" aria-label="${l.add}"><option value="">${l.choose}</option>${dayOptions.map((d,n)=>`<option value="${d}" ${selected===d?'selected':''}>${E(DAYS[lang][n][0])}</option>`).join("")}</select></div>${i.photo_source?`<a class="photo-source" href="${i.photo_source}" target="_blank" rel="noopener">Photo source / license ↗</a>`:""}</div></article>`}
function renderEvents(t){const rows=EVENTS.filter(e=>e.date>='2026-12-31'&&e.date<='2027-01-06').sort((a,b)=>a.date.localeCompare(b.date));const cards=rows.map(e=>`<article class="event-card"><time>${E(e.date)}</time><h3>${E(e.title)}</h3><p>${E(e.venue||'Rome')} · ${E(e.description||'')}</p><a href="${E(e.url)}" target="_blank" rel="noopener">${E(t.event_source||'Details')} ↗</a></article>`).join('');return `<div class="event-intro"><h3>${E(t.event_title||'Events during our stay')}</h3><p>${E(t.event_hint||'Check official dates before visiting.')}</p>${feedConnected?`<small>↻ ${E(t.event_fresh||'Updated')}: ${E(eventUpdated)}</small>`:''}</div><div class="event-grid">${cards||`<p>${E(t.event_none||'No dated events published yet')}</p>`}</div><div class="official-cal"><a target="_blank" rel="noopener" href="${EVENT_URL}">${E(t.event_calendar||'Official Rome events calendar')} ↗</a><a target="_blank" rel="noopener" href="https://www.romatoday.it/eventi/">RomaToday · Events ↗</a><a target="_blank" rel="noopener" href="https://www.ticketone.it/city/roma-216/">TicketOne · Roma ↗</a></div>`;}

const VISITOR_COPY={"en":{"title":"Rome Like a Local · Visitor Tips","sub":"Practical advice, local customs and winter-holiday details for your December 31–January 6 trip. Tap a topic to explore.","transport":"Getting around","culture":"Italian culture","food":"Coffee & food culture","holidays":"Winter & holidays","safety":"Safety & etiquette","jewish":"Jewish Rome","sources":"Official sources & updates","note":"Before visiting, double-check transport, holiday schedules and the latest rules with the official source."},"es":{"title":"Roma como un local · Consejos para viajeros","sub":"Consejos útiles, costumbres locales y detalles de las fiestas para tu viaje del 31 de diciembre al 6 de enero.","transport":"Cómo moverse","culture":"Cultura italiana","food":"Café y comida","holidays":"Invierno y fiestas","safety":"Seguridad y normas","jewish":"Roma judía","sources":"Fuentes oficiales","note":"Consulta siempre las normas y horarios actualizados en los enlaces oficiales."},"he":{"title":"רומא כמו מקומיים · טיפים למטיילים","sub":"עצות שימושיות, מנהגים מקומיים ומידע על החגים לטיול מ-31 בדצמבר עד 6 בינואר.","transport":"תחבורה","culture":"תרבות איטלקית","food":"קפה ואוכל","holidays":"חורף וחגים","safety":"בטיחות וכללים","jewish":"רומא היהודית","sources":"מקורות רשמיים","note":"לפני הביקור כדאי לבדוק שעות פתיחה ותקנות עדכניות באתר הרשמי."}};
const VISITOR_TIPS=[{"group":"transport","icon":"🚇","en":["Tap & Go on transport","You can use a contactless card or phone on ATAC metro, buses and trams. Tap again when changing transport, and keep using the same payment device. Each traveler needs their own payment method."],"es":["Paga con tarjeta en el transporte","En metro, autobús y tranvía de ATAC puedes pagar con tarjeta o móvil sin contacto. Valida al cambiar de transporte y usa siempre el mismo dispositivo. Cada viajero necesita su propio método de pago."],"he":["תשלום ללא מגע בתחבורה","אפשר להשתמש בכרטיס או בטלפון ללא מגע במטרו, באוטובוסים ובחשמליות של ATAC. יש לתקף שוב במעבר בין אמצעי תחבורה ולהשתמש באותו אמצעי תשלום. כל נוסע זקוק לכרטיס משלו."],"src":"https://www.atac.roma.it/en/tickets-and-passes/tap-go"},{"group":"transport","icon":"👟","en":["Walk in neighborhood clusters","Rome's center rewards walking: pair the Spanish Steps with Trevi; Pantheon with Piazza Navona; Colosseum with the Forum. Cobblestones and uneven paving make sturdy shoes useful."],"es":["Agrupa lugares cercanos","Es mejor recorrer Roma por zonas: Plaza de España con Trevi, Panteón con Navona, Coliseo con Foro. Usa calzado cómodo por los adoquines."],"he":["קבצו מקומות קרובים","עדיף לסייר לפי אזורים: המדרגות הספרדיות וטרווי; פנתאון ונאבונה; קולוסיאום והפורום. כדאי לנעול נעליים נוחות בגלל האבנים והרחובות."],"src":""},{"group":"transport","icon":"🚕","en":["Use official taxis","Use licensed white taxis with a taxi sign, an operating meter or an applicable official fixed fare. Confirm payment options and never follow an unsolicited ride offer inside an airport."],"es":["Usa taxis oficiales","Elige taxis blancos autorizados con taxímetro o tarifa fija oficial. Comprueba el método de pago y evita las ofertas de conductores no solicitadas en el aeropuerto."],"he":["בחרו במוניות רשמיות","מוניות מורשות הן לרוב לבנות ובעלות מונה או תעריף רשמי קבוע. בדקו מראש אמצעי תשלום והימנעו מהצעות נסיעה אקראיות בשדה התעופה."],"src":""},{"group":"food","icon":"☕","en":["Coffee is a ritual","An espresso is commonly just 'un caffè.' Many Italians drink it standing at the bar. Table service can cost more, especially near attractions. Cappuccino is most common in the morning, but you can order one whenever you like."],"es":["El café es un ritual","Un espresso suele llamarse 'un caffè'. Es habitual tomarlo de pie en la barra; sentarse puede costar más. El capuchino se toma sobre todo por la mañana, pero puedes pedirlo cuando quieras."],"he":["קפה הוא טקס יומי","אספרסו נקרא לעיתים פשוט 'un caffè'. רבים שותים בעמידה על הבר. שירות לשולחן עשוי לעלות יותר. קפוצ'ינו נפוץ בבוקר, אך אפשר להזמין בכל שעה."],"src":""},{"group":"food","icon":"🍽️","en":["Understand the restaurant bill","Look for 'coperto' (cover charge), 'servizio' (service) and prices printed on the menu. Tipping is appreciated for good service but is generally more modest than in the US. Kosher restaurants may have different menus and hours."],"es":["Entiende la cuenta","Revisa 'coperto' (cubierto), 'servizio' (servicio) y los precios del menú. La propina suele ser más modesta que en EE. UU. Los restaurantes kosher pueden tener horarios diferentes."],"he":["הבינו את החשבון","חפשו בתפריט 'coperto' (דמי עריכה) ו-'servizio' (שירות). טיפ באיטליה לרוב צנוע יותר מאשר בארה״ב. למסעדות כשרות יכולים להיות שעות ותפריטים שונים."],"src":""},{"group":"culture","icon":"🗣️","en":["A little Italian goes a long way","Use 'buongiorno' (good morning/day), 'buonasera' (good evening), 'per favore' (please) and 'grazie' (thank you). A friendly greeting before asking a question is appreciated."],"es":["Un poco de italiano ayuda","Aprende 'buongiorno', 'buonasera', 'per favore' y 'grazie'. Saludar antes de hacer una pregunta es una buena costumbre."],"he":["כמה מילים באיטלקית עוזרות","כדאי לומר 'buongiorno' (שלום בבוקר), 'buonasera' (ערב טוב), 'per favore' (בבקשה) ו-'grazie' (תודה). נעים להתחיל שיחה בברכה."],"src":""},{"group":"culture","icon":"🕰️","en":["Dinner comes later","Many Romans dine later than visitors from the US; some restaurants begin dinner service around 7:30–8 p.m. 'Aperitivo' is a social drink/snack period before dinner. Check individual hours, especially around holidays."],"es":["Se cena más tarde","Muchos romanos cenan más tarde; algunos restaurantes comienzan a servir a las 19:30–20:00. El 'aperitivo' es un momento social antes de la cena. Comprueba los horarios festivos."],"he":["ארוחת ערב מאוחרת","רבים ברומא אוכלים ארוחת ערב מאוחר יותר מאשר בארה״ב; יש מסעדות שמתחילות סביב 19:30–20:00. 'אפריטיבו' הוא מפגש חברתי לפני הערב. בדקו שעות בחגים."],"src":""},{"group":"safety","icon":"⛪","en":["Respect churches and monuments","Vatican sites require appropriate clothing: shoulders and knees covered; avoid hats inside. Do not sit on the Spanish Steps, climb monuments, or enter historic fountains."],"es":["Respeta iglesias y monumentos","En los sitios del Vaticano se exige ropa apropiada: hombros y rodillas cubiertos, sin sombreros dentro. No te sientes en la escalinata de Plaza de España ni entres en las fuentes."],"he":["כבדו כנסיות ואנדרטאות","באתרי הוותיקן נדרש לבוש מתאים: כתפיים וברכיים מכוסות וללא כובע בפנים. אל תשבו על המדרגות הספרדיות ואל תיכנסו למזרקות."],"src":"https://www.museivaticani.va/content/museivaticani/en/organizza-visita/consigli-utili.html"},{"group":"safety","icon":"🎒","en":["Watch bags in crowds","Be extra attentive around Termini, crowded buses, and major attractions. Keep phones and wallets in secured pockets or zipped crossbody bags; ignore unsolicited 'help' at ticket machines."],"es":["Cuida tus pertenencias","Presta especial atención en Termini, autobuses llenos y atracciones. Lleva móviles y carteras en bolsillos seguros y desconfía de la ayuda no solicitada en máquinas de billetes."],"he":["שמרו על התיקים","היזהרו במיוחד בטרמיני, באוטובוסים עמוסים ובאתרים פופולריים. שמרו ארנקים וטלפונים בתיקים סגורים והימנעו מ'עזרה' לא מבוקשת במכונות הכרטיסים."],"src":""},{"group":"holidays","icon":"🎆","en":["January 1 and January 6 are holidays","New Year's Day and Epiphany (La Befana) are Italian public holidays. Government offices close and individual attractions, shops and transport schedules may change. Confirm each stop before going."],"es":["El 1 y el 6 de enero son festivos","Año Nuevo y Epifanía (La Befana) son fiestas nacionales. Cierran oficinas y pueden cambiar horarios de atracciones, tiendas y transporte."],"he":["1 ו-6 בינואר הם חגים","ראש השנה האזרחית וחג ההתגלות (לה בפאנה) הם חגים רשמיים באיטליה. משרדים נסגרים וייתכנו שינויים בשעות של אתרים, חנויות ותחבורה."],"src":"https://www.italia.it/en/italy/practical-information/time-zones-and-public-holidays-italy"},{"group":"holidays","icon":"⛲","en":["Trevi Fountain has a close-up ticket","Since February 2026, access to the inner perimeter near the basin costs €2 for most non-resident visitors during regulated hours. Viewing the fountain from the square remains free; check official hours before arriving."],"es":["Trevi tiene entrada para acercarse","Desde febrero de 2026 se pagan 2 € por acceder al perímetro interior para la mayoría de no residentes. La vista desde la plaza sigue siendo gratuita; consulta los horarios oficiales."],"he":["לגישה קרובה לטרווי יש כרטיס","מפברואר 2026 הגישה לאזור הפנימי שליד המזרקה עולה בדרך כלל 2 אירו לתיירים שאינם תושבים. הצפייה מהכיכר נשארת בחינם; בדקו שעות רשמיות."],"src":"https://fontanaditrevi.roma.it/en"},{"group":"jewish","icon":"✡️","en":["Jewish Rome has a distinctive heritage","The Jewish Quarter around Via del Portico d'Ottavia and the Great Synagogue is a meaningful cultural stop. Rome has a historic Jewish community and its own culinary traditions. Check synagogue visitor requirements and current restaurant kosher certification directly."],"es":["El barrio judío tiene una historia especial","El barrio en torno a Via del Portico d'Ottavia y la Gran Sinagoga es un lugar cultural importante. Comprueba requisitos de visita y certificación kosher de cada restaurante."],"he":["לרומא היהודית מסורת ייחודית","הרובע סביב Via del Portico d'Ottavia ובית הכנסת הגדול הוא יעד היסטורי מיוחד. בדקו מראש תנאי ביקור בבית הכנסת והשגחה כשרות עדכנית של המסעדות."],"src":""},{"group":"jewish","icon":"🕯️","en":["Plan Shabbos walking distances carefully","The Airbnb is in Prati, not inside the Jewish Quarter. Arrange Friday and Saturday meals and any necessary walking route in advance. Do not assume the neighborhood is a short Shabbos walk for everyone."],"es":["Planifica bien las caminatas de Shabat","El alojamiento está en Prati, no en el barrio judío. Organiza las comidas y rutas a pie con antelación; la distancia no es corta para todo el mundo."],"he":["תכננו מרחקי הליכה בשבת","הדירה נמצאת בפראטי ולא בתוך הרובע היהודי. כדאי לתכנן מראש סעודות ומסלולי הליכה לשישי ושבת; לא לכל אחד זו הליכה קצרה."],"src":""}];
const VISITOR_GROUPS=["transport","food","culture","safety","holidays","jewish"];
function visitorTips(){const c=VISITOR_COPY[lang];return `<section class="visitor-guide" id="rome-tips"><div class="smallgold">LOCAL KNOW-HOW · WINTER 2027</div><h2>${E(c.title)}</h2><p class="visitor-intro">${E(c.sub)}</p><div class="visitor-groups">${VISITOR_GROUPS.map(group=>`<details class="visitor-group" ${group==="transport"?"open":""}><summary>${E(c[group])}<span>${VISITOR_TIPS.filter(x=>x.group===group).length} tips</span></summary><div class="visitor-tiles">${VISITOR_TIPS.filter(x=>x.group===group).map(item=>`<article class="visitor-tip"><div class="visitor-emoji">${item.icon}</div><div><h3>${E(item[lang][0])}</h3><p>${E(item[lang][1])}</p>${item.src?`<a target="_blank" rel="noopener" href="${item.src}">↗ ${E(c.sources)}</a>`:""}</div></article>`).join("")}</div></details>`).join("")}</div><p class="visitor-note">${E(c.note)}</p></section>`}
function render(){const t=UI[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';document.querySelectorAll('.langbuttons button').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));document.getElementById('lab-home').textContent=t.home;document.getElementById('lab-weather').textContent=t.weather;let cards=GROUPS.map(([cat,img],n)=>`<button type="button" class="category-tile ${openCategory===cat?'active':''}" data-cat="${cat}" aria-expanded="${openCategory===cat}"><img alt="" src="${img}"><span class="tile-copy"><span class="number">0${n+1} / ${cat==='events'?EVENTS.length:ITEMS.filter(x=>x.category===cat).length} ${cat==='events'?'EVENTS':'PLACES'}</span><h3>${t[cat]}</h3><span class="plus">${openCategory===cat?'−':'+'} ${openCategory===cat?t.close:t.open}</span></span></button>`).join('');
let panels=GROUPS.map(([cat,img])=>`<section class="panel ${openCategory===cat?'open':''}" id="panel-${cat}" aria-label="${E(t[cat])}"><div class="panelhead"><div><span class="smallgold">THE CITY EDIT</span><h2>${t[cat]}</h2><span>${cat==='events'?EVENTS.length:ITEMS.filter(x=>x.category===cat).length} ${lang==='he'?'מקומות':lang==='es'?'lugares':'places'}</span></div><button class="close-btn" data-close="${cat}">✕ ${t.close}</button></div>${cat==='events'?renderEvents(t):`<div class="cards">${cardsFor(cat)}</div>`}</section>`).join('');
document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-inner"><div class="eyebrow">ROME · ITALY · WINTER EDITION</div><h1>${t.headline}</h1><p>${t.subtitle}</p><div class="hero-actions"><a href="./my-trip.html">✈ ${lang==="he"?"הטיסות שלנו":lang==="es"?"Vuelos del grupo":"Our group flights"} →</a><a href="#explore" style="background:#fff;color:#174c48">📍 ${lang==="he"?"מקומות ברומא":lang==="es"?"Explorar Roma":"Explore Rome"} →</a></div></div></section><div class="quick-start"><a class="quick-link" href="./my-trip.html"><span class="quick-icon">✈️</span><span><strong>${lang==="he"?"טיסות הקבוצה":lang==="es"?"Vuelos del grupo":"Group Flights"}</strong><small>${lang==="he"?"הוסיפו טיסה וראו את זמני ההגעה":lang==="es"?"Añade tu vuelo y ve las llegadas":"Add your flight and see all arrivals"}</small></span></a><a class="quick-link" href="#daily-planner"><span class="quick-icon">📅</span><span><strong>${lang==="he"?"התוכנית היומית":lang==="es"?"Plan diario":"Daily itinerary"}</strong><small>${lang==="he"?"רעיונות לכל יום":lang==="es"?"Ideas para cada día":"See what to do each day"}</small></span></a><a class="quick-link" href="#explore"><span class="quick-icon">📍</span><span><strong>${lang==="he"?"אטרקציות ומסעדות":lang==="es"?"Lugares y restaurantes":"Places & restaurants"}</strong><small>${lang==="he"?"אטרקציות, כשר, בילויים וספא":lang==="es"?"Atracciones, kosher, ocio y spa":"Sights, kosher food, nightlife & spas"}</small></span></a></div><div class="quick-note">${lang==="he"?"בחרו מקום, שמרו אותו והוסיפו ליום. אלה המלצות — לא הזמנות.":lang==="es"?"Elige un lugar, guárdalo y añádelo al día que prefieras. Nada está reservado.":"Start here: Choose places, save favorites and add them to a day. Nothing is booked automatically."}</div><main class="container"><div class="intro" id="explore"><div class="smallgold">CURATED FOR THE GROUP</div><h2>${lang==='he'?'כל רומא, לפי קטגוריות':lang==='es'?'Todo Roma, por categorías':'Everything, beautifully organized'}</h2><p>${t.tip}</p></div>${toolbar()}<div class="category-grid">${cards}</div>${panels}${visitorTips()}${suggestedItinerary()}${builder()}${planBox()}<section class="planning-box"><h2>${V4[lang].maps}</h2>${areaMaps()}</section><p class="footnote">${t.note} ${t.status} ${t.photo_notice}</p></main><footer>${t.footer}</footer><div class="mobile-dock" aria-label="Quick navigation"><a href="#explore"><span>📍</span>${lang==="he"?"מקומות":lang==="es"?"Lugares":"Places"}</a><a href="#daily-planner"><span>📅</span>${lang==="he"?"מסלול":lang==="es"?"Plan":"Plan"}</a><a href="#rome-tips"><span>💡</span>${lang==="he"?"טיפים":lang==="es"?"Consejos":"Tips"}</a><a href="./my-trip.html"><span>✈️</span>${lang==="he"?"טיסות":lang==="es"?"Vuelos":"Flights"}</a></div>`;
document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{let c=b.dataset.cat;openCategory=openCategory===c?null:c;render();if(openCategory)requestAnimationFrame(()=>document.getElementById('panel-'+c).scrollIntoView({block:'start',behavior:'smooth'}));}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{openCategory=null;render();document.getElementById('explore').scrollIntoView({block:'start',behavior:'smooth'})}));bindV4();}
document.querySelectorAll('.langbuttons button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;history.replaceState({},'',location.pathname+'?lang='+lang);render()}));
const weatherNames={en:{0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm'},es:{0:'Despejado',1:'Casi despejado',2:'Algo nublado',3:'Nublado',45:'Niebla',61:'Lluvia',63:'Lluvia',80:'Chubascos',95:'Tormenta'},he:{0:'בהיר',1:'בהיר ברובו',2:'מעונן חלקית',3:'מעונן',45:'ערפל',61:'גשום',63:'גשום',80:'ממטרים',95:'סופת רעמים'}};
async function live(){const t=UI[lang];let abort=new AbortController();let timeout=setTimeout(()=>abort.abort(),10000);
let jobs=[fetch('https://api.frankfurter.dev/v2/rate/usd/eur',{signal:abort.signal}).then(r=>{if(!r.ok)throw Error('FX');return r.json()}).then(d=>{document.getElementById('usd').textContent=`$1 = €${Number(d.rate).toFixed(3)}`;document.getElementById('usd-date').textContent=`${t.currency_asof} · ${d.date}`}).catch(()=>{document.getElementById('usd').textContent=t.unavailable}),fetch('https://api.frankfurter.dev/v2/rate/ils/eur',{signal:abort.signal}).then(r=>{if(!r.ok)throw Error('FX');return r.json()}).then(d=>{document.getElementById('ils').textContent=`₪1 = €${Number(d.rate).toFixed(3)}`;document.getElementById('ils-date').textContent=`${t.currency_asof} · ${d.date}`}).catch(()=>{document.getElementById('ils').textContent=t.unavailable}),fetch('https://api.open-meteo.com/v1/forecast?latitude=41.9028&longitude=12.4964&current=temperature_2m,weather_code&timezone=Europe%2FRome',{signal:abort.signal}).then(r=>{if(!r.ok)throw Error('WEATHER');return r.json()}).then(d=>{let v=d.current;document.getElementById('weather').textContent=`${Math.round(v.temperature_2m)}°C · ${weatherNames[lang][v.weather_code]||weatherNames.en[v.weather_code]||'Rome'}`;document.getElementById('weather-date').textContent=`${t.weather_asof} · ${v.time.replace('T',' ')}`}).catch(()=>{document.getElementById('weather').textContent=t.unavailable})];await Promise.allSettled(jobs);clearTimeout(timeout)}
render();live();(async()=>{try{let r=await fetch('./events.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('feed');let data=await r.json();EVENTS=Array.isArray(data.events)?data.events:[];eventUpdated=data.updated||'';feedConnected=!!data.automatic;render()}catch(e){EVENTS=[];render()}})();document.getElementById('refresh').addEventListener('click',live);
</script></body></html>
